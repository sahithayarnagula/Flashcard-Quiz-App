<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="special-text">Flashcard Quiz App</h1>
    <div class="flashcard">
      <div id="card-text">Click "Show Answer" to start!</div>
      <button id="show-answer">Show Answer</button>
    </div>
    
    <div class="navigation">
      <button id="prev">Previous</button>
      <button id="next">Next</button>
    </div>
    
    <div class="flashcard-form">
      <h2 class="special-text">Add/Edit Flashcard</h2>
      <input type="text" id="question" placeholder="Question">
      <input type="text" id="answer" placeholder="Answer">
      <button id="add-card">Add Card</button>
      <button id="update-card">Update Card</button>
      <button id="delete-card">Delete Card</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
